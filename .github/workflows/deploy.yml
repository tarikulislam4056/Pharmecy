name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Upload to cPanel FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build
        run: |
          npm install
          npm run build
          cp api.php dist/ 2>/dev/null || true
          cp database.sql dist/ 2>/dev/null || true
          cp public/.htaccess dist/ 2>/dev/null || true

      - name: 🚀 Sync Files via FTP to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || '/public_html/' }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow false; set net:timeout 15; set net:max-retries 3; open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; mirror -R --delete --verbose ./dist/ '$FTP_DIR'"
