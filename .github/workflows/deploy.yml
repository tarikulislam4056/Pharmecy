name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Upload to cPanel FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build
        run: |
          npm install
          npm run build
          cp api.php dist/ 2>/dev/null || true
          cp database.sql dist/ 2>/dev/null || true
          cp public/.htaccess dist/ 2>/dev/null || true

      - name: 🚀 Sync Files via FTP to cPanel
        uses: SamKirland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/public_html/' }}
          local-dir: './dist/'
